<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
  body {
    background-color: #f2f2f2;
    font-family: Arial;
  }
  .box {
    width: 300px;
    margin: 100px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  input {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  button {
    width: 95%;
    padding: 8px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #message {
    color: darkred;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="checkLogin()">Login</button>
  <p id="message"></p>
</div>

<script>
function checkLogin() {
  var user = document.getElementById("username").value;
  var pass = document.getElementById("password").value;

  if (user == "" || pass == "") {
    document.getElementById("message").innerHTML = "Please fill both fields!";
  } else {
    document.getElementById("message").innerHTML = "Login Successful! Welcome " + user;
  }
}
</script>

</body>
</html>
